<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!-- Hace que la página se adapte correctamente al celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una flor para ti 🌼</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondo espacial -->
    <div class="space"></div>

    <!-- Estrellas -->
    <div class="stars"></div>

    <!-- Contenedor principal -->
    <main class="scene">

        <!-- Título -->
        <div class="intro">
            <h1>Para ti 🌼</h1>
            <p>Cada recuerdo tiene su lugar, por eso este es para ti ✨</p>
        </div>

        <!-- Flor -->
        <section class="flower" id="flower">

            <!-- Centro Corregido -->
            <div class="flower-center">
                <span>💛</span>
            </div>

            <!-- Pétalos con imágenes -->
            <div class="petal petal1">
                <img src="fotos/foto1.jpeg" alt="Foto 1">
            </div>

            <div class="petal petal2">
                <img src="fotos/foto2.jpeg" alt="Foto 2">
            </div>

            <div class="petal petal3">
                <img src="fotos/foto3.jpeg" alt="Foto 3">
            </div>

            <div class="petal petal4">
                <img src="fotos/foto4.jpeg" alt="Foto 4">
            </div>

            <div class="petal petal5">
                <img src="fotos/foto5.jpeg" alt="Foto 5">
            </div>

            <div class="petal petal6">
                <img src="fotos/foto6.jpg" alt="Foto 6">
            </div>

        </section>

        <!-- Mensaje Inferior -->
        <div class="message">
            <p>Toca una fotografía ✨</p>
        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
